<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOXFLIX · Películas y Series</title>
<meta name="description" content="Catálogo de películas y series por categorías: terror, acción, ciencia ficción y más.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --bg: #0A0C11;
  --bg-elev: #12151D;
  --bg-elev-2: #191D27;
  --line: #262B37;
  --text: #F1F0EC;
  --text-dim: #9198A6;
  --gold: #E8A33D;
  --crimson: #D8394A;
  --crimson-dim: #7A2530;
  --radius: 6px;
  --maxw: 1400px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box; margin:0; padding:0;}

html{
  scroll-behavior:smooth;
  scroll-padding-top: var(--safe-top);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
  overflow-x:hidden;
}

img{max-width:100%; display:block;}

h1,h2,h3, .marquee{
  font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
  letter-spacing:0.02em;
  line-height:1;
}

a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:#333846; border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ==========================================================================
   HEADER
   ========================================================================== */
.site-header{
  position:sticky;
  top:var(--safe-top);
  z-index:50;
  display:flex;
  align-items:center;
  gap:20px;
  padding:14px 5vw;
  background:linear-gradient(to bottom, rgba(8,9,13,0.95), rgba(8,9,13,0.75) 70%, transparent);
  backdrop-filter:blur(6px);
}

.logo{
  font-family:'Bebas Neue', sans-serif;
  font-size:28px;
  color:var(--crimson);
  letter-spacing:0.04em;
  white-space:nowrap;
}
.logo span{color:var(--text);}

.main-nav{display:flex; gap:18px; flex:1; overflow-x:auto; scrollbar-width:none;}
.main-nav::-webkit-scrollbar{display:none;}
.main-nav button{
  font-size:14px;
  color:var(--text-dim);
  white-space:nowrap;
  padding:6px 2px;
  border-bottom:2px solid transparent;
  transition:color .15s;
}
.main-nav button:hover, .main-nav button.active{color:var(--text); border-color:var(--crimson);}

.search-wrap{
  display:flex;
  align-items:center;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px 14px;
  gap:8px;
  flex-shrink:0;
}
.search-wrap input{
  background:none;
  border:none;
  color:var(--text);
  font-size:13px;
  width:120px;
  outline:none;
}
@media (min-width:640px){ .search-wrap input{width:180px;} }
.search-wrap svg{flex-shrink:0; opacity:0.6;}

/* ==========================================================================
   BANNER / HERO (carrusel)
   ========================================================================== */
.hero{
  position:relative;
  height:min(78vw, 620px);
  min-height:340px;
  width:100%;
  overflow:hidden;
}
.hero-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .8s ease;
  pointer-events:none;
}
.hero-slide.active{opacity:1; pointer-events:auto;}
.hero-slide img{
  width:100%; height:100%; object-fit:cover; object-position:center 20%;
}
.hero-gradient{
  position:absolute; inset:0;
  background:
    linear-gradient(to top, var(--bg) 2%, rgba(10,12,17,0.15) 55%, transparent 75%),
    linear-gradient(to right, rgba(10,12,17,0.85) 0%, rgba(10,12,17,0.15) 55%);
}
.hero-content{
  position:absolute;
  left:5vw; right:5vw;
  bottom:9%;
  max-width:560px;
}
.hero-badge{
  display:inline-block;
  background:var(--crimson);
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.08em;
  padding:4px 10px;
  border-radius:3px;
  margin-bottom:12px;
  text-transform:uppercase;
}
.hero-title{
  font-size:clamp(34px, 7vw, 68px);
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.5);
  margin-bottom:14px;
}
.hero-meta{
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:var(--text-dim); margin-bottom:14px;
}
.hero-meta .rating{color:var(--gold); font-weight:600;}
.hero-desc{
  font-size:14px;
  color:#D6D8DD;
  margin-bottom:20px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  max-width:480px;
}
.hero-actions{display:flex; gap:10px;}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 22px;
  border-radius:4px;
  font-size:14px;
  font-weight:600;
  transition:transform .15s, background .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:#fff; color:#111;}
.btn-primary:hover{background:#e2e2e2;}
.btn-secondary{background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25);}
.btn-secondary:hover{background:rgba(255,255,255,0.22);}

.hero-dots{
  position:absolute;
  bottom:18px; left:5vw;
  display:flex; gap:6px;
  z-index:2;
}
.hero-dots button{
  width:22px; height:3px;
  background:rgba(255,255,255,0.3);
  border-radius:2px;
  transition:background .2s;
}
.hero-dots button.active{background:var(--crimson);}

/* ==========================================================================
   FRANJA DE ANUNCIOS (nuevas / proximas)
   ========================================================================== */
.ad-strip{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:14px 5vw;
  scroll-snap-type:x mandatory;
}
.ad-strip::-webkit-scrollbar{display:none;}
.ad-card{
  flex:0 0 auto;
  width:min(78vw, 320px);
  scroll-snap-align:start;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
}
.ad-card img{width:52px; height:74px; object-fit:cover; border-radius:4px;}
.ad-card .ad-tag{
  font-size:10px; font-weight:700; letter-spacing:0.06em;
  text-transform:uppercase; padding:2px 6px; border-radius:3px;
  display:inline-block; margin-bottom:4px;
}
.ad-tag.nuevo{background:var(--crimson); color:#fff;}
.ad-tag.proximo{background:var(--gold); color:#221704;}
.ad-card h4{font-family:'Work Sans'; font-weight:600; font-size:13.5px; margin-bottom:2px;}
.ad-card p{font-size:11.5px; color:var(--text-dim);}

/* ==========================================================================
   FILAS DE CATEGORIAS
   ========================================================================== */
.row-section{padding:22px 0 6px;}
.row-head{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:0 5vw; margin-bottom:10px;
}
.row-head h2{font-size:22px; letter-spacing:0.03em;}
.row-head .row-count{font-size:12px; color:var(--text-dim);}

.row-scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 5vw 14px;
  scroll-snap-type:x proximity;
}
.row-scroll::-webkit-scrollbar{display:none;}

.card{
  position:relative;
  flex:0 0 auto;
  width:140px;
  scroll-snap-align:start;
  cursor:pointer;
  transition:transform .18s ease;
}
@media (min-width:640px){ .card{width:170px;} }
.card:hover{transform:translateY(-4px);}
.card-poster{
  position:relative;
  width:100%;
  aspect-ratio:2/3;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--bg-elev);
  border:1px solid var(--line);
}
.card-poster img{width:100%; height:100%; object-fit:cover;}
.card-tag{
  position:absolute; top:6px; left:6px;
  font-size:9.5px; font-weight:700; letter-spacing:0.05em;
  text-transform:uppercase; padding:2px 6px; border-radius:3px;
  color:#fff;
}
.card-tag.nuevo{background:var(--crimson);}
.card-tag.proximo{background:var(--gold); color:#221704;}
.card-rating{
  position:absolute; bottom:6px; right:6px;
  background:rgba(0,0,0,0.65);
  color:var(--gold);
  font-size:11px; font-weight:700;
  padding:2px 6px; border-radius:3px;
}
.card-title{
  font-size:13px; font-weight:500;
  margin-top:7px;
  color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-sub{font-size:11px; color:var(--text-dim); margin-top:1px;}

.empty-row{padding:0 5vw; color:var(--text-dim); font-size:13px;}

/* ==========================================================================
   MODAL DE DETALLE
   ========================================================================== */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(4,5,7,0.8);
  display:none;
  align-items:flex-start; justify-content:center;
  padding:0;
  z-index:200;
  overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--bg-elev);
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin-top:0;
}
@media (min-width:820px){
  .modal-box{ min-height:auto; margin-top:40px; border-radius:10px; overflow:hidden; margin-bottom:40px;}
}
.modal-close{
  position:fixed;
  top:calc(14px + var(--safe-top));
  right:calc(4vw);
  width:36px; height:36px;
  border-radius:50%;
  background:rgba(10,12,17,0.75);
  display:flex; align-items:center; justify-content:center;
  z-index:210;
}
.modal-banner{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.modal-banner img{width:100%; height:100%; object-fit:cover;}
.modal-banner .modal-gradient{
  position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg-elev), transparent 60%);
}
.modal-banner .modal-heading{
  position:absolute; left:24px; right:24px; bottom:16px;
}
.modal-heading h2{font-size:clamp(26px,5vw,40px); color:#fff;}

.modal-body{padding:20px 24px 40px;}
.modal-meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  font-size:13px; color:var(--text-dim); margin-bottom:16px;
}
.modal-meta .rating{color:var(--gold); font-weight:700;}
.modal-meta .badge{
  border:1px solid var(--line); padding:2px 8px; border-radius:3px; font-size:11.5px;
}
.modal-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.modal-tags span{
  font-size:11.5px; color:var(--text-dim);
  border:1px solid var(--line); padding:3px 9px; border-radius:14px;
}
.modal-desc{font-size:14.5px; line-height:1.6; color:#D8DAE0; margin-bottom:20px; max-width:640px;}
.modal-cast{font-size:13px; color:var(--text-dim); margin-bottom:24px;}
.modal-cast b{color:var(--text); font-weight:600;}

.player-block h3{
  font-family:'Work Sans'; font-size:13px; text-transform:uppercase;
  letter-spacing:0.07em; color:var(--text-dim); margin-bottom:10px;
}
.server-list{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.server-btn{
  padding:9px 16px;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--bg-elev-2);
  font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:7px;
}
.server-btn.active{background:var(--crimson); border-color:var(--crimson); color:#fff;}

.player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:6px;
  overflow:hidden;
  border:1px solid var(--line);
}
.player-frame iframe{width:100%; height:100%; border:none;}
.player-placeholder{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px;
  color:var(--text-dim); font-size:13.5px; text-align:center; padding:20px;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */
.site-footer{
  padding:40px 5vw 60px;
  border-top:1px solid var(--line);
  margin-top:30px;
  color:var(--text-dim);
  font-size:12.5px;
}
.site-footer .logo{display:block; margin-bottom:10px;}

/* ==========================================================================
   UTILIDADES
   ========================================================================== */
.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; scroll-behavior:auto !important;}
}
</style>
</head>

/* Lista de categorías que se muestran como filas, en el orden que quieras */
const CATEGORIAS = [
  { clave: "accion", nombre: "Acción" },
  { clave: "terror", nombre: "Terror" },
  { clave: "ficcion", nombre: "Ciencia Ficción" },
  { clave: "suspenso", nombre: "Suspenso" },
  { clave: "fantasia", nombre: "Fantasía" },
  { clave: "drama", nombre: "Drama" },
  { clave: "comedia", nombre: "Comedia" },
  { clave: "romance", nombre: "Romance" },
  { clave: "animacion", nombre: "Animación" },
  { clave: "documental", nombre: "Documentales" }
];

/* ==========================================================================
   MOTOR DEL SITIO
   No hace falta tocar este archivo para agregar contenido.
   Todo se construye solo a partir de CATALOGO y CATEGORIAS en data.js
   ========================================================================== */

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function estrellaSVG(){
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>`;
}

function tarjeta(item){
  const tagHTML = item.proximamente
    ? `<span class="card-tag proximo">Próximamente</span>`
    : item.nuevo
      ? `<span class="card-tag nuevo">Nuevo</span>`
      : '';
  const ratingHTML = (!item.proximamente && item.calificacion > 0)
    ? `<span class="card-rating">★ ${item.calificacion.toFixed(1)}</span>`
    : '';
  return `
    <div class="card" data-id="${item.id}">
      <div class="card-poster">
        <img src="${item.poster}" alt="${item.titulo}" loading="lazy">
        ${tagHTML}
        ${ratingHTML}
      </div>
      <div class="card-title">${item.titulo}</div>
      <div class="card-sub">${item.anio} · ${item.tipo === 'serie' ? 'Serie' : 'Película'}</div>
    </div>`;
}

function construirFila(contenedorId, items, tituloVacio){
  const cont = $(contenedorId);
  if(!items.length){
    cont.innerHTML = `<p class="empty-row">${tituloVacio}</p>`;
    return;
  }
  cont.innerHTML = items.map(tarjeta).join('');
}

function render(){
  // Fila: recién agregado
  const nuevos = CATALOGO.filter(i => i.nuevo);
  construirFila('#row-nuevos', nuevos, 'Todavía no hay títulos nuevos agregados.');

  // Fila: próximamente
  const proximos = CATALOGO.filter(i => i.proximamente);
  construirFila('#row-proximos', proximos, 'No hay estrenos programados por ahora.');

  // Filas por categoría
  const catCont = $('#categorias-container');
  catCont.innerHTML = '';
  CATEGORIAS.forEach(cat => {
    const items = CATALOGO.filter(i => i.categorias.includes(cat.clave) && !i.proximamente);
    if(!items.length) return; // no mostrar filas vacías
    const section = document.createElement('section');
    section.className = 'row-section';
    section.dataset.categoria = cat.clave;
    section.innerHTML = `
      <div class="row-head">
        <h2>${cat.nombre}</h2>
        <span class="row-count">${items.length} título${items.length>1?'s':''}</span>
      </div>
      <div class="row-scroll" id="row-cat-${cat.clave}"></div>
    `;
    catCont.appendChild(section);
    construirFila(`#row-cat-${cat.clave}`, items, '');
  });

  // Banner de anuncios (nuevos + proximos)
  const anuncios = [...nuevos, ...proximos];
  const adCont = $('#ad-strip');
  adCont.innerHTML = anuncios.map(a => `
    <div class="ad-card" data-id="${a.id}">
      <img src="${a.poster}" alt="${a.titulo}">
      <div>
        <span class="ad-tag ${a.proximamente ? 'proximo':'nuevo'}">${a.proximamente ? 'Próximamente' : 'Nuevo'}</span>
        <h4>${a.titulo}</h4>
        <p>${a.categorias.map(c => (CATEGORIAS.find(x=>x.clave===c)||{}).nombre).filter(Boolean).join(' · ')}</p>
      </div>
    </div>
  `).join('') || '<p class="empty-row">Sin anuncios por ahora.</p>';

  // Hero / carrusel
  construirHero();

  // Delegación de clicks en tarjetas
  document.addEventListener('click', (e) => {
    const card = e.target.closest('[data-id]');
    if(card) abrirModal(card.dataset.id);
  });
}

/* ---------------- HERO CARRUSEL ---------------- */
let heroIndex = 0;
let heroTimer = null;

function construirHero(){
  const destacados = CATALOGO.filter(i => i.destacado && (i.banner || i.poster));
  const hero = $('#hero');
  if(!destacados.length){ hero.classList.add('hidden'); return; }

  hero.innerHTML = `
    ${destacados.map((item, idx) => `
      <div class="hero-slide ${idx===0?'active':''}" data-id="${item.id}">
        <img src="${item.banner || item.poster}" alt="${item.titulo}">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          ${item.proximamente ? `<span class="hero-badge">Próximamente</span>` : item.nuevo ? `<span class="hero-badge">Nuevo</span>` : ''}
          <h1 class="hero-title">${item.titulo}</h1>
          <div class="hero-meta">
            ${item.calificacion > 0 ? `<span class="rating">★ ${item.calificacion.toFixed(1)}</span>` : ''}
            <span>${item.anio}</span>
            <span>${item.tipo === 'serie' ? 'Serie' : 'Película'}</span>
          </div>
          <p class="hero-desc">${item.sinopsis}</p>
          <div class="hero-actions">
            <button class="btn btn-primary" data-hero-play="${item.id}">▶ ${item.proximamente ? 'Ver detalles' : 'Reproducir'}</button>
            <button class="btn btn-secondary" data-hero-info="${item.id}">Más información</button>
          </div>
        </div>
      </div>
    `).join('')}
    <div class="hero-dots">
      ${destacados.map((_, idx) => `<button data-dot="${idx}" class="${idx===0?'active':''}"></button>`).join('')}
    </div>
  `;

  $$('[data-hero-play]', hero).forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); abrirModal(b.dataset.heroPlay, true);
  }));
  $$('[data-hero-info]', hero).forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); abrirModal(b.dataset.heroInfo, false);
  }));
  $$('[data-dot]', hero).forEach(dot => dot.addEventListener('click', () => {
    irASlide(parseInt(dot.dataset.dot), destacados.length);
  }));

  if(destacados.length > 1){
    clearInterval(heroTimer);
    heroTimer = setInterval(() => irASlide((heroIndex+1) % destacados.length, destacados.length), 6000);
  }
}

function irASlide(idx, total){
  heroIndex = idx;
  $$('.hero-slide').forEach((s,i) => s.classList.toggle('active', i===idx));
  $$('.hero-dots button').forEach((d,i) => d.classList.toggle('active', i===idx));
}

/* ---------------- MODAL DE DETALLE ---------------- */
function abrirModal(id, autoplay=false){
  const item = CATALOGO.find(i => i.id === id);
  if(!item) return;

  const overlay = $('#modal-overlay');
  const catNombres = item.categorias.map(c => (CATEGORIAS.find(x=>x.clave===c)||{}).nombre).filter(Boolean);

  $('#modal-content').innerHTML = `
    <div class="modal-banner">
      <img src="${item.banner || item.poster}" alt="${item.titulo}">
      <div class="modal-gradient"></div>
      <div class="modal-heading"><h2>${item.titulo}</h2></div>
    </div>
    <div class="modal-body">
      <div class="modal-meta">
        ${item.calificacion > 0 ? `<span class="rating">★ ${item.calificacion.toFixed(1)} / 10</span>` : '<span>Sin calificación aún</span>'}
        <span class="badge">${item.anio}</span>
        <span class="badge">${item.tipo === 'serie' ? 'Serie' : 'Película'}</span>
        <span class="badge">${item.duracion || ''}</span>
      </div>
      <div class="modal-tags">${catNombres.map(c => `<span>${c}</span>`).join('')}</div>
      <p class="modal-desc">${item.sinopsis}</p>
      <p class="modal-cast"><b>Reparto:</b> ${(item.reparto||[]).join(', ') || 'Por anunciar'}</p>
      <p class="modal-cast"><b>Dirección:</b> ${item.director || 'Por anunciar'}</p>

      <div class="player-block">
        <h3>Reproducir</h3>
        ${item.proximamente || !item.servidores.length ? `
          <div class="player-frame">
            <div class="player-placeholder">
              <div style="font-size:28px;">🎬</div>
              <div>Este título aún no está disponible.<br>Vuelve pronto.</div>
            </div>
          </div>
        ` : `
          <div class="server-list">
            ${item.servidores.map((s,idx) => `<button class="server-btn ${idx===0?'active':''}" data-server="${idx}">▶ ${s.nombre}</button>`).join('')}
          </div>
          <div class="player-frame">
            <iframe id="modal-player" src="${item.servidores[0].url}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
          </div>
        `}
      </div>
    </div>
  `;

  if(!item.proximamente && item.servidores.length){
    $$('.server-btn').forEach(btn => btn.addEventListener('click', () => {
      $$('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $('#modal-player').src = item.servidores[btn.dataset.server].url;
    }));
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarModal(){
  $('#modal-overlay').classList.remove('open');
  $('#modal-content').innerHTML = '';
  document.body.style.overflow = '';
}

/* ---------------- BUSCADOR ---------------- */
function buscar(termino){
  const q = termino.trim().toLowerCase();
  const catCont = $('#categorias-container');
  const heroSection = $('#hero');
  const adSection = $('#ad-strip').closest('section') || $('#ad-strip').parentElement;
  const filasFijas = $('#row-nuevos').closest('section');
  const filaProx = $('#row-proximos').closest('section');

  if(!q){
    catCont.classList.remove('hidden');
    heroSection.classList.remove('hidden');
    if(filasFijas) filasFijas.classList.remove('hidden');
    if(filaProx) filaProx.classList.remove('hidden');
    $('#search-results').classList.add('hidden');
    return;
  }

  heroSection.classList.add('hidden');
  if(filasFijas) filasFijas.classList.add('hidden');
  if(filaProx) filaProx.classList.add('hidden');
  catCont.classList.add('hidden');

  const resultados = CATALOGO.filter(i =>
    i.titulo.toLowerCase().includes(q) ||
    i.categorias.some(c => c.includes(q))
  );

  const resCont = $('#search-results');
  resCont.classList.remove('hidden');
  resCont.innerHTML = `
    <div class="row-head"><h2>Resultados para "${termino}"</h2><span class="row-count">${resultados.length} encontrados</span></div>
    <div class="row-scroll" style="flex-wrap:wrap; overflow:visible;">${resultados.map(tarjeta).join('') || '<p class="empty-row">No se encontraron títulos.</p>'}</div>
  `;
}

/* ---------------- INIT ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  render();

  $('#modal-close').addEventListener('click', cerrarModal);
  $('#modal-overlay').addEventListener('click', (e) => { if(e.target.id === 'modal-overlay') cerrarModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrarModal(); });

  $('#search-input').addEventListener('input', (e) => buscar(e.target.value));

  $$('.main-nav button[data-scroll]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.querySelector(`[data-categoria="${btn.dataset.scroll}"]`);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
});
</script>
